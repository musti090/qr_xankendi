<!doctype html>
<html lang="az">
<head>

  <meta name="theme-color" content="#f6f2eb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#15130f" media="(prefers-color-scheme: dark)">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600&family=Noto+Serif+Display:ital,wght@0,500;0,600;1,400&display=swap">
  <link rel="stylesheet" href="assets/css/style.css">

<body>
  <a class="skip-link" href="#main">Əsas məzmuna keç</a>

  <header class="topbar">
    <div class="container topbar-inner" id="topbar"></div>
  </header>

  <main id="main" tabindex="-1">
    <noscript>
      <p class="container noscript">Səhifəni görmək üçün brauzerdə JavaScript-i aktiv edin.</p>
    </noscript>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span id="footer-text"></span>
      <button type="button" class="text-btn" data-top>Yuxarı qayıt ↑</button>
    </div>
  </footer>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Şəklin böyüdülmüş görünüşü" hidden>
    <button type="button" class="lb-close" id="lb-close" aria-label="Bağla">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <figure class="lb-figure">
      <img id="lb-img" alt="">

    </figure>
  </div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
